---
# Valors no secrets de la VPN WireGuard (activitat 3).
wg_interface: wg-vcorp
wg_listen_port: 13231
wg_server_address: 10.7.10.1
wg_client_address: 10.7.10.2
wg_client_name: client-erik
wg_prefix_len: 24
wg_tunnel_network: 10.7.10.0/24

# Xarxes autoritzades per al client. pl3_direccio (10.7.3.128/25) queda fora a posta.
wg_allowed_networks:
  - 10.7.0.0/25
  - 10.7.0.128/26
  - 10.7.0.192/27
  - 10.7.1.0/24
  - 10.7.2.0/24
  - 10.7.3.0/25
wg_address_list: vcorp-wg-allowed

# Endpoint que veu el client (reenviament UDP de VirtualBox al node de control).
wg_endpoint_host: 127.0.0.1
wg_endpoint_port: 13231
wg_vbox_vm: mikrotik0
wg_vbox_forward_rule: "wireguard,udp,127.0.0.1,13231,,13231"

# Claus i fitxer del client: fora de Git (artifacts/ esta al .gitignore).
wg_artifacts_dir: "{{ (playbook_dir ~ '/../../../artifacts/vpn') | realpath }}"
wg_client_private_key_path: "{{ wg_artifacts_dir }}/client.key"
wg_client_public_key_path: "{{ wg_artifacts_dir }}/client.pub"
wg_client_conf_name: wg-vcorp-client.conf
