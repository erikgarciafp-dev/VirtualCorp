---
all:
  children:
    dhcp_servers:
      hosts:
        kea01:
          ansible_host: 10.7.0.136
          ansible_user: root
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/vcorp_sysadmin"
    vbox:
      hosts:
        localhost:
          ansible_connection: local
          vboxmanage_bin: VBoxManage
          mikrotik_routers:
            - mikrotik0
            - mikrotik1
            - mikrotik2
            - mikrotik3
    routeros:
      hosts:
        mikrotik0:
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: community.routeros.routeros
          ansible_host: 127.0.0.1
          ansible_port: 2200
          ansible_user: sysadmin
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/vcorp_sysadmin"
        mikrotik1:
          ansible_host: 10.7.0.226
          ansible_paramiko_proxy_command: ssh -i /home/erik/.ssh/vcorp_sysadmin -p 2200 -W %h:%p sysadmin@127.0.0.1
        mikrotik2:
          ansible_host: 10.7.0.230
          ansible_paramiko_proxy_command: ssh -i /home/erik/.ssh/vcorp_sysadmin -p 2200 -W %h:%p sysadmin@127.0.0.1
        mikrotik3:
          ansible_host: 10.7.0.234
          ansible_paramiko_proxy_command: ssh -i /home/erik/.ssh/vcorp_sysadmin -p 2200 -W %h:%p sysadmin@127.0.0.1
