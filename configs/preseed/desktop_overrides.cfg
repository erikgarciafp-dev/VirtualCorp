
# ============================================================
# VirtualCorp - Debian Desktop (LXQt + Falkon)
# ============================================================
d-i keyboard-configuration/xkb-keymap select es
d-i console-setup/layoutcode string es
d-i passwd/root-login boolean false
# No s'executa tasksel: evita que s'instal.li l'escriptori per defecte (GNOME)
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server sudo xorg sddm lxqt-core falkon
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false
